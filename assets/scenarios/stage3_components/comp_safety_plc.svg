<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadowPlc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- ISOMETRIC SAFETY PLC (2.5D GAME ART) -->
  <g filter="url(#shadowPlc)">
    <!-- Top Face -->
    <path d="M 35,65 L 80,40 L 125,65 L 80,90 Z" fill="#FACC15" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Left Dark Face -->
    <path d="M 35,65 L 35,115 L 80,140 L 80,90 Z" fill="#CA8A04" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right Bright Face (Front Panel) -->
    <path d="M 80,90 L 80,140 L 125,115 L 125,65 Z" fill="#EAB308" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Terminal Blocks Top -->
    <path d="M 45,60 L 75,43 L 85,49 L 55,66 Z" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
    <path d="M 75,77 L 105,60 L 115,66 L 85,83 Z" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Front Panel Display / LEDs -->
    <path d="M 85,93 L 115,76 L 115,100 L 85,117 Z" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Diagnostic LEDs -->
    <circle cx="92" cy="98" r="2.5" fill="#22C55E"/>
    <circle cx="99" cy="94" r="2.5" fill="#22C55E"/>
    <circle cx="106" cy="90" r="2.5" fill="#38BDF8"/>
    <circle cx="92" cy="106" r="2.5" fill="#EAB308"/>
    <circle cx="99" cy="102" r="2.5" fill="#22C55E"/>
    <circle cx="106" cy="98" r="2.5" fill="#EF4444"/>

    <!-- Redundant Dual-Channel Symbol -->
    <text x="100" y="114" font-size="7" font-family="monospace" font-weight="bold" fill="#F8FAFC" transform="skewY(-15)">SIL 3</text>
  </g>
</svg>
