<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadowMs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- ISOMETRIC MECHANICAL MICROSWITCH (2.5D GAME ART) -->
  <g filter="url(#shadowMs)">
    <!-- Switch Body Box -->
    <path d="M 45,80 L 75,63 L 105,80 L 75,97 Z" fill="#64748B" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 45,80 L 45,120 L 75,137 L 75,97 Z" fill="#475569" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 75,97 L 75,137 L 105,120 L 105,80 Z" fill="#94A3B8" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Screw Mounts -->
    <circle cx="85" cy="115" r="3.5" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="95" cy="109" r="3.5" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Spring Lever Arm -->
    <path d="M 55,75 L 85,35" stroke="#CBD5E1" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 55,75 L 85,35" stroke="#0F172A" stroke-width="1" stroke-linecap="round"/>
    <!-- Roller Wheel -->
    <circle cx="88" cy="32" r="8" fill="#DC2626" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="88" cy="32" r="3" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
  </g>
</svg>
